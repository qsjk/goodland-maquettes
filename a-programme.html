<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Commissioner:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
a{color:#12324A}a:hover{color:#0A1F2E}

.row-sel{background:#F4F7EC}.row-sold{color:#6B777E}

<script src="runtime.js"></script>
</head>
<body>
<div id="dc-root"></div>
<a href="index.html" style="position:fixed;left:16px;bottom:16px;z-index:50;display:flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:999px;background:#111;color:#fff;text-decoration:none;font:600 14px system-ui,sans-serif;box-shadow:0 6px 20px rgba(0,0,0,.25)">← Όλες οι προτάσεις</a>
<script type="text/x-dc-template" id="dc-template">

<div style="font-family: 'Commissioner', sans-serif; color: #14212B; background: #FFFFFF; width: 100%">

  <header style="border-bottom: 1px solid #E2E7E3">
    <div style="max-width: 1280px; margin: 0 auto; padding: 18px 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px">
      <a href="a-accueil.html" style="display: flex; align-items: center; gap: 12px; text-decoration: none; color: #14212B">
        <svg width="40" height="40" viewBox="0 0 40 40" fill="none" stroke="#12324A" stroke-width="2" aria-hidden="true"><path d="M5 19 20 7l15 12"/><path d="M10 16v17h20V16"/><path d="M17 33v-9h6v9"/></svg>
        <span style="display: flex; flex-direction: column; line-height: 1.1">
          <span style="font-weight: 700; font-size: 19px; letter-spacing: .14em">ΕΥΓΕΙΟΣ</span>
          <span style="font-size: 11px; letter-spacing: .22em; color: #4A5A64">GOODLAND · ΚΑΤΑΣΚΕΥΕΣ</span>
        </span>
      </a>
      <nav aria-label="Διαδρομή" style="font-size: 15px; color: #4A5A64; display: flex; gap: 8px; flex-wrap: wrap">
        <a href="a-accueil.html">Αρχική</a><span>/</span><a href="a-accueil.html">Ακίνητα προς πώληση</a><span>/</span><span style="color: #14212B; font-weight: 600">Περιστέρι</span>
      </nav>
      <a href="tel:+302130996050" style="display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: 999px; background: #12324A; color: #FFFFFF; text-decoration: none; font-weight: 600; font-size: 15px">213 099 6050</a>
    </div>
  </header>

  
  <section style="padding: 48px 24px 24px">
    <div style="max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px">
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <span style="padding: 6px 12px; border-radius: 999px; background: #EEF1E6; color: #3E4A16; font-size: 13px; font-weight: 600">Ενεργειακή κλάση Α</span>
        <span style="padding: 6px 12px; border-radius: 999px; background: #E8EEF3; color: #12324A; font-size: 13px; font-weight: 600">Υπό κατασκευή</span>
        <span style="padding: 6px 12px; border-radius: 999px; background: #F1F2F2; color: #3B4A54; font-size: 13px; font-weight: 600">5όροφη με pilotis &amp; υπόγειο</span>
      </div>
      <h1 style="margin: 0; font-size: 52px; font-weight: 700; letter-spacing: -0.02em; color: #12324A">Αλκαμένους 4, Περιστέρι</h1>
    </div>
  </section>

  
  <section style="padding: 8px 24px 64px">
    <div style="max-width: 1280px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 32px; align-items: flex-start">
      <div style="flex: 999 1 600px; min-width: 0; display: flex; flex-direction: column; gap: 12px">
        <div class="ph" style="height: 520px; border-radius: 24px; display: flex; align-items: flex-end; padding: 20px; box-sizing: border-box">
          <span style="background: rgba(255,255,255,.9); color: #12324A; padding: 8px 14px; border-radius: 999px; font-size: 14px; font-weight: 600">{{currentImg}}</span>
        </div>
        <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px">
          <sc-for list="{{imgs}}" as="im" hint-placeholder-count="6">
            <sc-if value="{{im.active}}" hint-placeholder-val="{{ false }}">
              <button type="button" onClick="{{im.pick}}" aria-label="{{im.label}}" class="ph" style="height: 72px; border-radius: 12px; border: 3px solid #12324A; cursor: pointer"></button>
            </sc-if>
            <sc-if value="{{im.inactive}}" hint-placeholder-val="{{ true }}">
              <button type="button" onClick="{{im.pick}}" aria-label="{{im.label}}" class="ph" style="height: 72px; border-radius: 12px; border: 3px solid transparent; cursor: pointer; opacity: .7"></button>
            </sc-if>
          </sc-for>
        </div>
      </div>
      <aside style="flex: 1 1 340px; min-width: 0; border: 1px solid #E2E7E3; border-radius: 24px; padding: 28px; display: flex; flex-direction: column; gap: 20px">
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px">
          <div style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 32px; font-weight: 700; color: #12324A">11</span><span style="font-size: 14px; color: #4A5A64">κατοικίες</span></div>
          <div style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 32px; font-weight: 700; color: {{accent}}">4</span><span style="font-size: 14px; color: #4A5A64">διαθέσιμες</span></div>
          <div style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 32px; font-weight: 700; color: #12324A">48–107</span><span style="font-size: 14px; color: #4A5A64">τ.μ.</span></div>
          <div style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 32px; font-weight: 700; color: #12324A">150k €</span><span style="font-size: 14px; color: #4A5A64">τιμή από</span></div>
        </div>
        <p style="margin: 0; font-size: 15px; line-height: 1.6; color: #3B4A54">Πενταώροφη πολυκατοικία επί pilotis με υπόγειο, κατασκευή υψηλών προδιαγραφών. Παράδοση υπό κατασκευή: επιλέγετε εσείς τα υλικά.</p>
        <a href="#interest" style="display: flex; align-items: center; justify-content: center; min-height: 52px; border-radius: 999px; background: {{accent}}; color: #FFFFFF; text-decoration: none; font-weight: 700; font-size: 16px">Κλείστε ραντεβού</a>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
          <a href="tel:+306945135770" style="display: flex; align-items: center; justify-content: center; min-height: 48px; border-radius: 999px; border: 1.5px solid #12324A; text-decoration: none; font-weight: 600; font-size: 15px">Κλήση</a>
          <a href="#interest" style="display: flex; align-items: center; justify-content: center; min-height: 48px; border-radius: 999px; border: 1.5px solid #12324A; text-decoration: none; font-weight: 600; font-size: 15px">WhatsApp</a>
        </div>
      </aside>
    </div>
  </section>

  
  <section id="lots" style="padding: 48px 24px">
    <div style="max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px">
      <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px">
        <h2 style="margin: 0; font-size: 36px; font-weight: 700; color: #12324A; letter-spacing: -0.01em">Διαμερίσματα &amp; μεζονέτες</h2>
        <div role="group" aria-label="Φίλτρα" style="display: flex; flex-wrap: wrap; gap: 8px">
          <sc-for list="{{filters}}" as="f" hint-placeholder-count="5">
            <sc-if value="{{f.active}}" hint-placeholder-val="{{ false }}">
              <button type="button" onClick="{{f.pick}}" aria-pressed="true" style="min-height: 44px; padding: 0 18px; border-radius: 999px; border: 1.5px solid #12324A; background: #12324A; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">{{f.label}}</button>
            </sc-if>
            <sc-if value="{{f.inactive}}" hint-placeholder-val="{{ true }}">
              <button type="button" onClick="{{f.pick}}" aria-pressed="false" style="min-height: 44px; padding: 0 18px; border-radius: 999px; border: 1.5px solid #CDD5D0; background: #FFFFFF; color: #14212B; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">{{f.label}}</button>
            </sc-if>
          </sc-for>
        </div>
      </div>
      <div style="overflow-x: auto; border: 1px solid #E2E7E3; border-radius: 20px">
        <table class="lots" style="width: 100%; border-collapse: collapse; font-size: 16px">
          <thead style="background: #F6F8F5">
            <tr><th>Όροφος</th><th>Τύπος</th><th>Εμβαδόν</th><th>Υπνοδ.</th><th>Μπάνια</th><th>Τιμή</th><th>Κατάσταση</th><th></th></tr>
          </thead>
          <tbody>
            <sc-for list="{{lots}}" as="l" hint-placeholder-count="11">
              <tr class="{{l.cls}}">
                <td>{{l.floor}}</td>
                <td style="font-weight: 600">{{l.type}}</td>
                <td>{{l.m2}} τ.μ.</td>
                <td>{{l.beds}}</td>
                <td>{{l.baths}}</td>
                <td style="font-weight: 700">{{l.price}}</td>
                <td>
                  <sc-if value="{{l.avail}}" hint-placeholder-val="{{ true }}">
                    <span style="padding: 5px 12px; border-radius: 999px; background: {{accent}}; color: #FFFFFF; font-size: 13px; font-weight: 600">Διαθέσιμο</span>
                  </sc-if>
                  <sc-if value="{{l.sold}}" hint-placeholder-val="{{ false }}">
                    <span style="padding: 5px 12px; border-radius: 999px; background: #EEF0EF; color: #4A5A64; font-size: 13px; font-weight: 600">Πωλήθηκε</span>
                  </sc-if>
                </td>
                <td>
                  <sc-if value="{{l.avail}}" hint-placeholder-val="{{ true }}">
                    <a href="#interest" onClick="{{l.pick}}" style="font-weight: 600; font-size: 15px">Ενδιαφέρομαι →</a>
                  </sc-if>
                </td>
              </tr>
            </sc-for>
          </tbody>
        </table>
      </div>
      <span style="font-size: 14px; color: #4A5A64">{{countLabel}}</span>
    </div>
  </section>

  
  <section style="padding: 48px 24px">
    <div style="max-width: 1280px; margin: 0 auto; background: #F2F5F1; border-radius: 28px; padding: 48px; display: flex; flex-direction: column; gap: 28px">
      <h2 style="margin: 0; font-size: 32px; font-weight: 700; color: #12324A">Σε κάθε κατοικία</h2>
      <ul style="margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 18px 32px">
        <sc-for list="{{features}}" as="ft" hint-placeholder-count="8">
          <li style="display: flex; gap: 12px; align-items: flex-start; font-size: 16px; line-height: 1.5">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#3E4A16" stroke-width="2" aria-hidden="true" style="flex: none; margin-top: 1px"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg>
            <span>{{ft}}</span>
          </li>
        </sc-for>
      </ul>
    </div>
  </section>

  
  <section id="interest" style="padding: 48px 24px 96px">
    <div style="max-width: 1280px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 40px">
      <div style="display: flex; flex-direction: column; gap: 16px">
        <h2 style="margin: 0; font-size: 32px; font-weight: 700; color: #12324A">Τοποθεσία</h2>
        <div class="ph" style="height: 380px; border-radius: 24px; display: flex; align-items: center; justify-content: center; color: #3F4F5A; font-size: 14px">Χάρτης · Αλκαμένους 4, Περιστέρι</div>
      </div>
      <form style="display: flex; flex-direction: column; gap: 16px; border: 1px solid #E2E7E3; border-radius: 24px; padding: 32px">
        <h2 style="margin: 0; font-size: 28px; font-weight: 700; color: #12324A">Ενδιαφέρομαι</h2>
        <div style="padding: 14px 16px; border-radius: 14px; background: #EEF1E6; color: #3E4A16; font-size: 15px; font-weight: 600">{{selLabel}}</div>
        <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600">Όνομα<input type="text" style="min-height: 48px; border: 1px solid #CDD5D0; border-radius: 12px; padding: 0 14px; font: inherit; font-weight: 400"></label>
        <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600">Τηλέφωνο<input type="tel" style="min-height: 48px; border: 1px solid #CDD5D0; border-radius: 12px; padding: 0 14px; font: inherit; font-weight: 400"></label>
        <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600">Μήνυμα<textarea rows="3" style="border: 1px solid #CDD5D0; border-radius: 12px; padding: 12px 14px; font: inherit; font-weight: 400; resize: vertical"></textarea></label>
        <button type="button" style="min-height: 52px; border: 0; border-radius: 999px; background: {{accent}}; color: #FFFFFF; font: inherit; font-weight: 700; font-size: 16px; cursor: pointer">Ζητήστε επικοινωνία</button>
      </form>
    </div>
  </section>

  <footer style="border-top: 1px solid #E2E7E3; padding: 32px 24px">
    <div style="max-width: 1280px; margin: 0 auto; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 16px; font-size: 14px; color: #4A5A64">
      <span>© 2026 ΕΥΓΕΙΟΣ GOODLAND Μ. ΕΠΕ · Ύδρας 14, Μοσχάτο</span>
      <a href="mailto:goodlandcon@gmail.com">goodlandcon@gmail.com</a>
    </div>
  </footer>
</div>
</script>
<script>

class Component extends DCLogic {
  constructor(props) { super(props); this.state = { filter: 'all', img: 0, sel: 9 }; }
  renderVals() {
    const accent = this.props.accent ?? '#55621F';
    const ALL = [
      { floor: '1ος', type: 'Διαμέρισμα', m2: 48, beds: 1, baths: '1', price: '150.000 €', avail: true },
      { floor: '1ος', type: 'Διαμέρισμα', m2: 73, beds: 2, baths: '1', price: '—', avail: false },
      { floor: '1ος', type: 'Διαμέρισμα', m2: 70, beds: 2, baths: '1', price: '—', avail: false },
      { floor: '2ος', type: 'Διαμέρισμα', m2: 59, beds: 1, baths: '1', price: '—', avail: false },
      { floor: '2ος', type: 'Διαμέρισμα', m2: 54, beds: 1, baths: '1', price: '—', avail: false },
      { floor: '3ος', type: 'Διαμέρισμα', m2: 52, beds: 1, baths: '1', price: '—', avail: false },
      { floor: '3ος', type: 'Διαμέρισμα', m2: 70, beds: 2, baths: '1', price: '—', avail: false },
      { floor: '3ος', type: 'Διαμέρισμα', m2: 52, beds: 1, baths: '1', price: '—', avail: false },
      { floor: '4ος–5ος', type: 'Μεζονέτα', m2: 105, beds: 2, baths: '2 + WC', price: '335.000 €', avail: true },
      { floor: '4ος–5ος', type: 'Μεζονέτα', m2: 99, beds: 3, baths: '2 + WC', price: '320.000 €', avail: true },
      { floor: '4ος–5ος', type: 'Μεζονέτα', m2: 107, beds: 2, baths: '2', price: '335.000 €', avail: true }
    ];
    const f = this.state.filter;
    const keep = (l) => f === 'all' || (f === 'avail' && l.avail) || (f === 'b1' && l.beds === 1) || (f === 'b2' && l.beds === 2) || (f === 'b3' && l.beds >= 3);
    const lots = ALL.map((l, i) => ({
      ...l, sold: !l.avail,
      cls: i === this.state.sel ? 'row-sel' : (l.avail ? 'row' : 'row-sold'),
      pick: () => this.setState({ sel: i })
    })).filter(keep);
    const F = [['all', 'Όλα'], ['avail', 'Διαθέσιμα'], ['b1', '1 υπνοδ.'], ['b2', '2 υπνοδ.'], ['b3', '3 υπνοδ.']];
    const IM = ['Πρόσοψη', 'Είσοδος', 'Σαλόνι', 'Κουζίνα', 'Υπνοδωμάτιο', 'Κάτοψη'];
    const s = ALL[this.state.sel];
    return {
      accent,
      lots,
      countLabel: lots.length + ' από 11 κατοικίες · ' + lots.filter((l) => l.avail).length + ' διαθέσιμες',
      filters: F.map(([k, label]) => ({ label, active: f === k, inactive: f !== k, pick: () => this.setState({ filter: k }) })),
      imgs: IM.map((label, i) => ({ label, active: i === this.state.img, inactive: i !== this.state.img, pick: () => this.setState({ img: i }) })),
      currentImg: 'Τρισδιάστατη απεικόνιση · ' + IM[this.state.img] + ' (' + (this.state.img + 1) + '/6)',
      selLabel: 'Για: ' + s.type + ' ' + s.m2 + ' τ.μ., ' + s.floor + ' όροφος · ' + s.price,
      features: [
        'Θέση στάθμευσης', 'Αποθήκη στο υπόγειο', 'Θερμομονωτικά κουφώματα & ενεργειακοί υαλοπίνακες',
        'Εξωτερική θερμομόνωση κελύφους', 'Παροχή για φορτιστή ηλεκτρικού αυτοκινήτου', 'Αναμονή για ηλιακό θερμοσίφωνα & A/C',
        'Θέρμανση με λέβητα και σώματα', 'Laminate δάπεδα & σίτες'
      ]
    };
  }
}

window.__dcMount(Component, {"accent": "#55621F"});
</script>
</body>
</html>
