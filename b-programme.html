<!doctype html>
<html lang="el">
<head>

<style>

a{color:#ECE8E1}a:hover{color:#FFFFFF}

.card{border:1px solid #2D2C29;background:#171716}

</style>

<script src="runtime.js"></script>
</head>
<body>
<div id="dc-root"></div>
<div style="position:fixed;left:16px;right:16px;bottom:16px;z-index:50;display:flex;justify-content:space-between;gap:8px;pointer-events:none"><a href="index.html" style="display:flex;align-items:center;min-height:44px;padding:0 16px;border-radius:999px;text-decoration:none;font:600 14px system-ui,sans-serif;box-shadow:0 6px 20px rgba(0,0,0,.25);pointer-events:auto;background:#111;color:#fff">← Όλες</a><a href="a-programme.html" style="display:flex;align-items:center;min-height:44px;padding:0 16px;border-radius:999px;text-decoration:none;font:600 14px system-ui,sans-serif;box-shadow:0 6px 20px rgba(0,0,0,.25);pointer-events:auto;background:#fff;color:#111;border:1px solid #ccc">Πρόταση Α ⇄</a></div>
<script type="text/x-dc-template" id="dc-template">

<div style="font-family: 'Sofia Sans', sans-serif; color: #ECE8E1; background: #121212; width: 100%">

  <header style="padding: 24px; border-bottom: 1px solid #2D2C29">
    <div style="max-width: 1320px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px">
      <a href="b-accueil.html" style="display: flex; flex-direction: column; text-decoration: none; line-height: 1.05">
        <span style="font-family: 'Noto Serif Display', serif; font-size: 26px; letter-spacing: .18em">ΕΥΓΕΙΟΣ</span>
        <span style="font-size: 11px; letter-spacing: .38em; color: #C8A465">GOODLAND</span>
      </a>
      <nav aria-label="Διαδρομή" style="display: flex; gap: 10px; font-size: 14px; letter-spacing: .08em; color: #A8A296">
        <a href="b-accueil.html">ΑΡΧΙΚΗ</a><span>/</span><a href="b-accueil.html">ΑΚΙΝΗΤΑ</a><span>/</span><span style="color: #ECE8E1">ΠΕΡΙΣΤΕΡΙ</span>
      </nav>
      <a href="tel:+302130996050" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 20px; border: 1px solid #ECE8E1; text-decoration: none; font-size: 15px">213 099 6050</a>
    </div>
  </header>

  
  <section style="padding: 56px 24px 80px">
    <div style="max-width: 1320px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 48px; align-items: stretch">
      <div style="flex: 1 1 420px; display: flex; flex-direction: column; justify-content: space-between; gap: 40px">
        <div style="display: flex; flex-direction: column; gap: 22px">
          <span style="font-size: 13px; letter-spacing: .32em; color: #C8A465">ΠΕΡΙΣΤΕΡΙ · ΥΠΟ ΚΑΤΑΣΚΕΥΗ</span>
          <h1 style="margin: 0; font-family: 'Noto Serif Display', serif; font-weight: 300; font-size: 76px; line-height: 1.02">Αλκαμένους 4</h1>
          <p style="margin: 0; font-size: 18px; line-height: 1.65; color: #C9C3B8">Πενταώροφη πολυκατοικία επί pilotis με υπόγειο. Ενεργειακή κλάση Α, κατασκευή υψηλών προδιαγραφών. Αγοράζοντας τώρα, επιλέγετε εσείς τα υλικά.</p>
        </div>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px 24px">
          <div style="border-top: 1px solid #3A3934; padding-top: 14px; display: flex; flex-direction: column; gap: 6px"><span style="font-family: 'Noto Serif Display', serif; font-size: 40px">11</span><span style="font-size: 14px; color: #A8A296">κατοικίες</span></div>
          <div style="border-top: 1px solid #3A3934; padding-top: 14px; display: flex; flex-direction: column; gap: 6px"><span style="font-family: 'Noto Serif Display', serif; font-size: 40px; color: {{accent}}">4</span><span style="font-size: 14px; color: #A8A296">διαθέσιμες</span></div>
          <div style="border-top: 1px solid #3A3934; padding-top: 14px; display: flex; flex-direction: column; gap: 6px"><span style="font-family: 'Noto Serif Display', serif; font-size: 40px">48–107</span><span style="font-size: 14px; color: #A8A296">τ.μ.</span></div>
          <div style="border-top: 1px solid #3A3934; padding-top: 14px; display: flex; flex-direction: column; gap: 6px"><span style="font-family: 'Noto Serif Display', serif; font-size: 40px">Α</span><span style="font-size: 14px; color: #A8A296">ενεργειακή κλάση</span></div>
        </div>
      </div>
      <div style="flex: 999 1 640px; min-width: 0; display: flex; flex-direction: column; gap: 10px">
        <div class="ph" style="height: 560px; display: flex; align-items: flex-end; justify-content: space-between; padding: 20px; box-sizing: border-box; gap: 12px">
          <span style="font-size: 13px; letter-spacing: .12em; color: #C9C3B8">{{currentImg}}</span>
          <span style="display: flex; gap: 8px">
            <button type="button" onClick="{{prev}}" aria-label="Προηγούμενη" style="width: 48px; height: 48px; border: 1px solid #ECE8E1; background: rgba(18,18,18,.6); color: #ECE8E1; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button>
            <button type="button" onClick="{{next}}" aria-label="Επόμενη" style="width: 48px; height: 48px; border: 1px solid #ECE8E1; background: rgba(18,18,18,.6); color: #ECE8E1; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
          </span>
        </div>
        <div style="height: 3px; background: #2D2C29"><div style="height: 3px; width: {{progress}}; background: {{accent}}"></div></div>
      </div>
    </div>
  </section>

  
  <section id="lots" style="padding: 40px 24px 100px">
    <div style="max-width: 1320px; margin: 0 auto; display: flex; flex-direction: column; gap: 32px">
      <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 20px">
        <h2 style="margin: 0; font-family: 'Noto Serif Display', serif; font-weight: 300; font-size: 52px">Οι κατοικίες</h2>
        <div role="group" aria-label="Φίλτρα" style="display: flex; flex-wrap: wrap; gap: 6px">
          <sc-for list="{{filters}}" as="f" hint-placeholder-count="5">
            <sc-if value="{{f.active}}" hint-placeholder-val="{{ false }}">
              <button type="button" onClick="{{f.pick}}" aria-pressed="true" style="min-height: 44px; padding: 0 18px; border: 1px solid {{accent}}; background: {{accent}}; color: #121212; font: inherit; font-size: 14px; font-weight: 600; letter-spacing: .04em; cursor: pointer">{{f.label}}</button>
            </sc-if>
            <sc-if value="{{f.inactive}}" hint-placeholder-val="{{ true }}">
              <button type="button" onClick="{{f.pick}}" aria-pressed="false" style="min-height: 44px; padding: 0 18px; border: 1px solid #3A3934; background: transparent; color: #ECE8E1; font: inherit; font-size: 14px; letter-spacing: .04em; cursor: pointer">{{f.label}}</button>
            </sc-if>
          </sc-for>
        </div>
      </div>
      <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px">
        <sc-for list="{{lots}}" as="l" hint-placeholder-count="11">
          <div class="{{l.cls}}" style="padding: 24px; display: flex; flex-direction: column; gap: 16px">
            <div style="display: flex; justify-content: space-between; align-items: center; gap: 12px">
              <span style="font-size: 13px; letter-spacing: .22em; color: #A8A296">{{l.floor}} ΟΡΟΦΟΣ</span>
              <sc-if value="{{l.avail}}" hint-placeholder-val="{{ true }}">
                <span style="font-size: 12px; letter-spacing: .16em; color: #121212; background: {{accent}}; padding: 4px 10px">ΔΙΑΘΕΣΙΜΟ</span>
              </sc-if>
              <sc-if value="{{l.sold}}" hint-placeholder-val="{{ false }}">
                <span style="font-size: 12px; letter-spacing: .16em; color: #A8A296; border: 1px solid #3A3934; padding: 3px 10px">ΠΩΛΗΘΗΚΕ</span>
              </sc-if>
            </div>
            <div style="display: flex; align-items: baseline; gap: 10px">
              <span style="font-family: 'Noto Serif Display', serif; font-size: 48px; line-height: 1">{{l.m2}}</span>
              <span style="font-size: 15px; color: #A8A296">τ.μ. · {{l.type}}</span>
            </div>
            <span style="font-size: 15px; color: #C9C3B8">{{l.beds}} υπνοδωμάτια · {{l.baths}} μπάνια</span>
            <div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; border-top: 1px solid #2D2C29; padding-top: 16px">
              <span style="font-family: 'Noto Serif Display', serif; font-size: 24px">{{l.price}}</span>
              <sc-if value="{{l.avail}}" hint-placeholder-val="{{ true }}">
                <a href="#interest" onClick="{{l.pick}}" style="font-size: 14px; letter-spacing: .08em; color: {{accent}}">ΕΝΔΙΑΦΕΡΟΜΑΙ →</a>
              </sc-if>
            </div>
          </div>
        </sc-for>
      </div>
    </div>
  </section>

  
  <section style="padding: 0 24px 100px">
    <div style="max-width: 1320px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 64px">
      <h2 style="flex: 1 1 320px; margin: 0; font-family: 'Noto Serif Display', serif; font-weight: 300; font-size: 44px; line-height: 1.1">Σε κάθε κατοικία</h2>
      <ul style="flex: 2 1 560px; margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); column-gap: 40px">
        <sc-for list="{{features}}" as="ft" hint-placeholder-count="8">
          <li style="padding: 18px 0; border-top: 1px solid #2D2C29; font-size: 17px; color: #C9C3B8">{{ft}}</li>
        </sc-for>
      </ul>
    </div>
  </section>

  
  <section id="interest" style="padding: 0 24px 120px">
    <div style="max-width: 1320px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 48px">
      <div class="ph" style="flex: 1 1 480px; min-height: 480px; display: flex; align-items: center; justify-content: center; color: #A8A296; font-size: 13px; letter-spacing: .14em">ΧΑΡΤΗΣ · ΑΛΚΑΜΕΝΟΥΣ 4, ΠΕΡΙΣΤΕΡΙ</div>
      <form style="flex: 1 1 440px; display: flex; flex-direction: column; gap: 22px">
        <h2 style="margin: 0; font-family: 'Noto Serif Display', serif; font-weight: 300; font-size: 44px">Κλείστε μια επίσκεψη</h2>
        <div style="border: 1px solid {{accent}}; padding: 16px 18px; font-size: 16px; color: #ECE8E1">{{selLabel}}</div>
        <label style="display: flex; flex-direction: column; gap: 8px; font-size: 13px; letter-spacing: .16em; color: #A8A296">ΟΝΟΜΑ<input type="text" style="min-height: 48px; border: 0; border-bottom: 1px solid #5A5850; background: transparent; color: #ECE8E1; font: inherit; font-size: 17px; letter-spacing: 0"></label>
        <label style="display: flex; flex-direction: column; gap: 8px; font-size: 13px; letter-spacing: .16em; color: #A8A296">ΤΗΛΕΦΩΝΟ<input type="tel" style="min-height: 48px; border: 0; border-bottom: 1px solid #5A5850; background: transparent; color: #ECE8E1; font: inherit; font-size: 17px; letter-spacing: 0"></label>
        <div style="display: flex; flex-wrap: wrap; gap: 12px">
          <button type="button" style="min-height: 54px; padding: 0 32px; border: 0; background: {{accent}}; color: #121212; font: inherit; font-weight: 600; font-size: 16px; letter-spacing: .04em; cursor: pointer">Ζητήστε επικοινωνία</button>
          <a href="tel:+306945135770" style="display: inline-flex; align-items: center; min-height: 54px; padding: 0 28px; border: 1px solid #ECE8E1; text-decoration: none; font-size: 16px">Κλήση</a>
        </div>
      </form>
    </div>
  </section>

  <footer style="border-top: 1px solid #2D2C29; padding: 32px 24px">
    <div style="max-width: 1320px; margin: 0 auto; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 16px; font-size: 14px; color: #A8A296">
      <span>© 2026 ΕΥΓΕΙΟΣ GOODLAND Μ. ΕΠΕ · Ύδρας 14, Μοσχάτο</span>
      <a href="mailto:goodlandcon@gmail.com">goodlandcon@gmail.com</a>
    </div>
  </footer>
</div>
</script>
<script>

class Component extends DCLogic {
  constructor(props) { super(props); this.state = { filter: 'all', img: 0, sel: 9 }; }
  renderVals() {
    const accent = this.props.accent ?? '#C8A465';
    const ALL = [
      { floor: '1ος', type: 'Διαμέρισμα', m2: 48, beds: 1, baths: '1', price: '150.000 €', avail: true },
      { floor: '1ος', type: 'Διαμέρισμα', m2: 73, beds: 2, baths: '1', price: '—', avail: false },
      { floor: '1ος', type: 'Διαμέρισμα', m2: 70, beds: 2, baths: '1', price: '—', avail: false },
      { floor: '2ος', type: 'Διαμέρισμα', m2: 59, beds: 1, baths: '1', price: '—', avail: false },
      { floor: '2ος', type: 'Διαμέρισμα', m2: 54, beds: 1, baths: '1', price: '—', avail: false },
      { floor: '3ος', type: 'Διαμέρισμα', m2: 52, beds: 1, baths: '1', price: '—', avail: false },
      { floor: '3ος', type: 'Διαμέρισμα', m2: 70, beds: 2, baths: '1', price: '—', avail: false },
      { floor: '3ος', type: 'Διαμέρισμα', m2: 52, beds: 1, baths: '1', price: '—', avail: false },
      { floor: '4ος–5ος', type: 'Μεζονέτα', m2: 105, beds: 2, baths: '2 + WC', price: '335.000 €', avail: true },
      { floor: '4ος–5ος', type: 'Μεζονέτα', m2: 99, beds: 3, baths: '2 + WC', price: '320.000 €', avail: true },
      { floor: '4ος–5ος', type: 'Μεζονέτα', m2: 107, beds: 2, baths: '2', price: '335.000 €', avail: true }
    ];
    const f = this.state.filter;
    const keep = (l) => f === 'all' || (f === 'avail' && l.avail) || (f === 'b1' && l.beds === 1) || (f === 'b2' && l.beds === 2) || (f === 'b3' && l.beds >= 3);
    const lots = ALL.map((l, i) => ({
      ...l, sold: !l.avail,
      cls: i === this.state.sel ? 'card-sel' : (l.avail ? 'card' : 'card-sold'),
      pick: () => this.setState({ sel: i })
    })).filter(keep);
    const F = [['all', 'Όλες'], ['avail', 'Διαθέσιμες'], ['b1', '1 υπνοδ.'], ['b2', '2 υπνοδ.'], ['b3', '3 υπνοδ.']];
    const IM = ['Πρόσοψη', 'Είσοδος', 'Σαλόνι', 'Κουζίνα', 'Υπνοδωμάτιο', 'Κάτοψη'];
    const n = IM.length, img = this.state.img;
    const s = ALL[this.state.sel];
    return {
      accent, lots,
      filters: F.map(([k, label]) => ({ label, active: f === k, inactive: f !== k, pick: () => this.setState({ filter: k }) })),
      currentImg: 'ΤΡΙΣΔΙΑΣΤΑΤΗ ΑΠΕΙΚΟΝΙΣΗ · ' + IM[img].toUpperCase() + ' · ' + (img + 1) + '/' + n,
      progress: Math.round(((img + 1) / n) * 100) + '%',
      prev: () => this.setState({ img: (img + n - 1) % n }),
      next: () => this.setState({ img: (img + 1) % n }),
      selLabel: 'Για: ' + s.type + ' ' + s.m2 + ' τ.μ., ' + s.floor + ' όροφος · ' + s.price,
      features: [
        'Θέση στάθμευσης', 'Αποθήκη στο υπόγειο', 'Θερμομονωτικά κουφώματα & ενεργειακοί υαλοπίνακες',
        'Εξωτερική θερμομόνωση κελύφους', 'Παροχή για φορτιστή ηλεκτρικού αυτοκινήτου', 'Αναμονή για ηλιακό θερμοσίφωνα & A/C',
        'Θέρμανση με λέβητα και σώματα', 'Laminate δάπεδα & σίτες'
      ]
    };
  }
}

window.__dcMount(Component, {"accent": "#C8A465"});
</script>
</body>
</html>
