<script>

class Component extends DCLogic {
  constructor(props) { super(props); this.state = { lang: 'el' }; }
  renderVals() {
    const lang = this.state.lang;
    const T = {
      el: { nav1: 'Ακίνητα προς πώληση', nav2: 'Ολοκληρωμένα έργα', nav3: 'Υπηρεσίες', nav4: 'Οικοπεδούχοι', nav5: 'Επικοινωνία',
        badge: 'Ενεργειακή κλάση Α · 25+ χρόνια εμπειρίας',
        h1: 'Νεόδμητες κατοικίες κλάσης Α, σε τιμές κάτω από την αγορά.',
        sub: 'Πάνω από 25 χρόνια χτίζουμε στην Αθήνα κατοικίες υψηλών προδιαγραφών. Εσείς επιλέγετε υλικά και διαρρύθμιση πριν την παράδοση.',
        cta1: 'Διαθέσιμα ακίνητα', cta2: 'Είμαι οικοπεδούχος' },
      en: { nav1: 'Homes for sale', nav2: 'Completed projects', nav3: 'Services', nav4: 'Land owners', nav5: 'Contact',
        badge: 'Energy class A · 25+ years of experience',
        h1: 'New-build A-class homes, below market prices.',
        sub: 'For over 25 years we have been building high-spec homes across Athens. You choose the finishes and layout before handover.',
        cta1: 'Available homes', cta2: 'I own land' }
    };
    return {
      accent: this.props.accent ?? '#55621F',
      t: T[lang],
      isEl: lang === 'el',
      isEn: lang === 'en',
      setEl: () => this.setState({ lang: 'el' }),
      setEn: () => this.setState({ lang: 'en' }),
      stats: [
